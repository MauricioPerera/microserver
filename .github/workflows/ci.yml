name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Ensure cgo toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done

      - name: Pull embeddinggemma
        run: ollama pull embeddinggemma

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      # Self-hosted badge: no Codecov/Coveralls account needed. Computes
      # coverage % here and publishes a shields.io "endpoint badge" JSON
      # file to an orphan `badges` branch using the default GITHUB_TOKEN,
      # which shields.io then renders live via /endpoint.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          COLOR=$(awk -v pct="$PCT" 'BEGIN { if (pct>=80) print "brightgreen"; else if (pct>=60) print "yellow"; else print "red" }')
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > /tmp/coverage.json
          cat /tmp/coverage.json

          git config user.email "actions@github.com"
          git config user.name "github-actions"

          if git fetch origin badges 2>/dev/null; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git diff --staged --quiet || (git commit -m "Update coverage badge" && git push origin badges)
